name: filevaultpro
description: A secure file vault application with storage analytics and compression

# IMPORTANT: Increment the build number (+1) each time you deploy
# Example: 1.0.0+26 → 1.0.0+27 → 1.0.0+28
version: 1.0.0+28

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6

  # File & Storage Management
  path_provider: ^2.1.1          # Get device storage paths
  path: ^1.9.0                   # Path manipulation utilities
  file_picker: ^6.1.1            # File picker (if used)
  
  # File Operations
  open_filex: ^4.3.4             # Open files with native apps
  share_plus: ^7.2.1             # Share files
  
  # Storage & Compression
  archive: ^3.4.9                # Zip compression (if used in Dart)
  
  # NEW: Dashboard with Tabs Dependencies
  fl_chart: ^0.65.0              # Beautiful interactive charts
  intl: ^0.18.1                  # Date formatting and internationalization
  
  # State Management (if using)
  # provider: ^6.1.1             # Uncomment if you use Provider
  
  # Networking (if needed)
  # http: ^1.1.0                 # Uncomment if you make API calls
  
  # Local Storage (if needed)
  # shared_preferences: ^2.2.2   # Uncomment if you use SharedPreferences
  # sqflite: ^2.3.0              # Uncomment if you use SQLite

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0          # Recommended lints for Flutter

# Flutter configuration
flutter:
  uses-material-design: true

  # App Icons
  # assets:
  #   - assets/images/
  #   - assets/icons/
  
  # If you have custom fonts, uncomment and configure:
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700