name: file_vault_pro
description: "A comprehensive file management and security app for iOS"
publish_to: 'none'

version: 1.0.0+25

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  open_filex: ^4.3.4
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  fl_chart: ^1.1.1
  percent_indicator: ^4.2.3
  image_picker: ^1.1.2
  photo_manager: ^3.5.2
  archive: ^4.0.7
  path: ^1.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
